<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>React</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css" crossorigin="anonymous">
    <script src="https://unpkg.com/react@17/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <h1 class="bg-primary text-white display-4">React</h1>
    <div class="container mt-3">
        <div id="root">Wait...</div>
    </div>
    <script type="text/babel">
        let dom = document.querySelector('#root')

        let title = "React page"
        let message = "メッセージを表示します。"
        let content_true = `これが、trueのときに表示されます`
        let content_false = `これが、falseのときに表示されます`
        let flg = true;

        let data = [
            {name:'Taro', mail:'taro@yamada', age:45},
            {name:'Hanako', mail:'hanako@flower', age:37},
            {name:'Sachiko', mail:'sachiko@happy', age:29},
            {name:'Jiro', mail:'jiro@change', age:18},
            {name:'Kumi', mail:'kumi@class', age:56},
        ]

        let site = {
            url: 'https://www.google.com',
            title: 'Google',
            caption: 'これは Google の検索サイトです'
        }

        const msg_s = {
            fontSize: "20pt",
            fontWeight: "bold",
            color: "red",
            border: "2px solid green"            
        }

        let printMsg = function(msg, size, color) {
            const style = {
                fontSize: size + "pt",
                fontWeight: '700',
                color: color,
                border: "1px solid " + color
            }
            return <p style={style}>{msg}</p>
        }

        let el = (
            <div className="alert alert-primary">
                <h4>{title}</h4>
                <h6>{message}</h6>
                <div className="alert alert-secondary mt-3">
                    {printMsg('最初のメッセージ', 36, '#fff')}
                    {printMsg('次のメッセージ', 24, '#aaa')}
                    {printMsg('最後のメッセージ', 12, '#666')}
                </div>
                {flg ?
                    <div className="alert alert-primary mt-3">
                        <p>{content_true}</p>
                    </div>
                :
                    <div className="alert alert-secondary mt-3">
                        <p>{content_false}</p>
                    </div>
                }
                <table className="table table-striped mt-4">
                    <thead className="thead-dark">
                        <tr>
                            <th>name</th>
                            <th>mail</th>
                            <th>age</th>
                        </tr>
                    </thead>
                    <tbody>
                        {data.map((value) => (
                            <tr>
                                <td>{value.name}</td>
                                <td>{value.mail}</td>
                                <td>{value.age}</td>
                            </tr>
                        ))}
                    </tbody>
                </table>

                {(()=>
                    <div className="card mt-4">
                        <div className="card-header">
                            {site.title}
                        </div>
                        <div className="card-body">
                            {site.caption}
                        </div>
                        <div className="card-footer">
                            <a href={site.url}>{site.title}に移動</a>
                        </div>
                    </div>
                )()}
            </div>    
        )
        ReactDOM.render(el, dom)
    </script>
</body>    
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>React</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css" crossorigin="anonymous">    
    <script src="https://unpkg.com/react@17/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <h1 class="bg-primary text-white display-4">React</h1>
    <div class="container mt-3">
        <div id="root">Wait...</div>
    </div>
    <script type="text/babel">
    let dom = document.querySelector('#root')

    let title = "新タイトル"
    let message = "新しいメッセージ"
    let link = "https://www.google.com"
    let flg = false

    const msg_style = {
        fontSize:"20pt",
        color:"red",
        border:"1px solid blue"
    }

    //JSXを返す関数
    let printMessage = function(msg, size, color) {
        const style = {
            fontSize: size + "pt",
            fontWeight: '700',
            color: color,
            border: "1px solid " + color
        }
        return <p style={style}>{msg}</p>
    }

    let data = [
        <li className="list-group-item">One</li>,
        <li className="list-group-item">Two</li>,
        <li className="list-group-item">Three</li>
    ]

    let addresses = [
        {zip:100, address:"Sapporo"},
        {zip:200, address:"Tokyo"},
        {zip:300, address:"Osaka"},
    ]

    let el = (
        <div className="alert alert-primary">
            <h2>{title}</h2>
            <p style={msg_style}>{message}</p>
            <h5><a href={link}>This is link</a></h5>
        {flg ?
            <div>
                {printMessage('ほげほげ',36,'#fff')}
                {printMessage('ふがふが',24,'#aaa')}
                {printMessage('あほ侍',12,'#666')}
            </div>
        :
            <div>
                {printMessage('HOGE',36,'#fff')}
            </div>
        }
            <ul className="list-group mt-4">
            {addresses.map((value)=>(
                <li className="list-group-item">{value.address}({value.zip})</li>                                    
            ))}
            </ul>
        </div>
    )
    ReactDOM.render(el, dom);
    </script>
</body>    
</html>

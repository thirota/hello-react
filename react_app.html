<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>React</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css" crossorigin="anonymous">
    <script src="https://unpkg.com/react@17/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
</head>
<body>
    <h1 class="bg-primary text-white display-4">React</h1>
    <div class="container mt-3">
        <div id="root">Wait...</div>
    </div>
    <script src="./script.js"></script>
    <div class="container mt-3">
        <div class="bg-primary text-white">primary</div>
        <div class="bg-secondary text-white">secondary</div>
        <div class="bg-success text-dark">success</div>
        <div class="bg-warning text-dark">warning</div>
    </div>
    <div class="container mt-3">
        <div class="m-4 bg-warning">margin 3</div>
        <div class="p-4 bg-warning">padding 3</div>
    </div>
    <div class="container mt-3">
        <form>
            <div class="form-group">
                <label for="id">account</label>
                <input type="email" class="form-control" id="id"/>
            </div>
            <div class="form-group">
                <label for="pass">password</label>
                <input type="password" class="form-control" id="pass"/>
            </div>
            <div class="form-check">
                <input type="checkbox" class="form-check-input" id="check"/>
                <label class="form-check-label" for="check">Checkbox</label>
            </div>
            <div class="form-check">
                <input type="radio" class="form-check-input" id="rb1"/>
                <label class="form-check-label" for="rb1">Radio button1</label>
            </div>
            <div class="form-check">
                <input type="radio" class="form-check-input" id="rb2"/>
                <label class="form-check-label" for="rb2">Radio button2</label>
            </div>
        </form>
    </div>
</body>    
</html>

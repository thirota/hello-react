<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>React</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css" crossorigin="anonymous">    
    <script src="https://unpkg.com/react@17/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
</head>
<body>
    <h1 class="bg-primary text-white display-4">React</h1>
    <div class="container mt-3">
        <form>
            <div class="form-group">
                <label for="id">account</label>
                <input type="email" class="form-control" id="id">
            </div>
            <div>
                <label for="pass">password</label>
                <input type="password" class="form-control" id="pass">
            </div>
            <div class="form-check">
                <input type="checkbox" class="form-check-input" id="check">
                <label class="form-check-label" for="check">チェックボックス</label>
            </div>
            <div class="form-check">
                <input type="radio" class="form-check-input" id="rb1" name="rb">
                <label class="form-check-label" for="rb1">ラジオ1</label>
            </div>
            <div class="form-check">
                <input type="radio" class="form-check-input" id="rb2" name="rb">
                <label class="form-check-label" for="rb2">ラジオ2</label>
            </div>
            <a class="btn btn-primary" href="https://www.google.com">Submit</a>
            </form>
</div>
</body>    
</html>
